# Documentation example: starts only a LOCAL PostgreSQL database.
# It does not connect the application to the database or enable AI/auth.
name: shiwei-local
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: shiwei_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHIWEI_DB_ADMIN_PASSWORD:?Set SHIWEI_DB_ADMIN_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shiwei_pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiwei_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  shiwei_pg17:
